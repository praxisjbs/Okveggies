name: Deploy to production (SFTP)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time. The upload is a whole-tree SFTP sync into a single
# docroot, and the last step calls one shared migration runner against whatever
# migrations/ holds at that moment. Two runs overlapping means one is writing
# files into the tree the other is migrating from: on 1 Sep 2026 three deploys
# ran together and a migration from one branch was applied by another branch's
# runner. It came out right only because migrations are idempotent and version
# tracked. Serialising removes the race rather than relying on that.
#
# cancel-in-progress stays false on purpose. Cancelling a running deploy would
# kill an SFTP upload part way and leave the docroot half old and half new,
# which is the one state worse than waiting. A queued run is superseded by a
# newer one instead, and that is safe: every upload is the full tree, so the
# newer commit carries whatever the skipped one held, and the migration runner
# applies every version that is still pending.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Brand consistency check
        # Nothing ships that breaks a house law. Same guard as CI.
        run: bash scripts/brand-check.sh

      - name: Stage a clean upload set
        run: |
          mkdir -p _dist
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='_to_delete' --exclude='_dist' --exclude='*.tar.gz' \
            --exclude='.env' \
            ./ _dist/
          echo "Files staged: $(find _dist -type f | wc -l)"

      - name: Upload over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:      ${{ secrets.SFTP_HOST }}
          port:        ${{ secrets.SFTP_PORT }}
          username:    ${{ secrets.SFTP_USER }}
          password:    ${{ secrets.SFTP_PASSWORD }}
          local_path:  './_dist/*'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only:   true
          delete_remote_files: false

      - name: Apply migrations on the server
        run: |
          echo "Calling the migration runner..."
          curl -fsS --retry 2 --max-time 120 \
            -H "X-Migrate-Token: ${{ secrets.MIGRATE_TOKEN }}" \
            "${{ secrets.APP_BASE_URL }}/public/migrate.php" | tee /tmp/migrate.out
          grep -q "MIGRATE OK" /tmp/migrate.out || { echo "Migrations did not report success"; exit 1; }
          echo "Deploy complete."