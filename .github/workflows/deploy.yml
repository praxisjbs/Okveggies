name: Deploy to production (SFTP)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage a clean upload set
        run: |
          mkdir -p _dist
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='_to_delete' --exclude='_dist' --exclude='*.tar.gz' \
            --exclude='.env' \
            ./ _dist/
          echo "Files staged: $(find _dist -type f | wc -l)"

      - name: Upload over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:      ${{ secrets.SFTP_HOST }}
          port:        ${{ secrets.SFTP_PORT }}
          username:    ${{ secrets.SFTP_USER }}
          password:    ${{ secrets.SFTP_PASSWORD }}
          local_path:  './_dist/*'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only:   true
          delete_remote_files: false

      - name: Apply migrations on the server
        run: |
          echo "Calling the migration runner..."
          curl -fsS --retry 2 --max-time 120 \
            -H "X-Migrate-Token: ${{ secrets.MIGRATE_TOKEN }}" \
            "${{ secrets.APP_BASE_URL }}/public/migrate.php" | tee /tmp/migrate.out
          grep -q "MIGRATE OK" /tmp/migrate.out || { echo "Migrations did not report success"; exit 1; }
          echo "Deploy complete."