; =============================================================================
; OK Veggies .user.ini (cPanel PHP-FPM per-directory overrides)
; Production-safe PHP settings. Never display errors to the browser.
; =============================================================================

display_errors = Off
display_startup_errors = Off
log_errors = On

; Uploads: product images, kitchen-run lists, payment proofs, issue photos.
upload_max_filesize = 8M
post_max_size = 12M
max_file_uploads = 20

; Sessions
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1

; Reasonable limits for a produce storefront on shared hosting.
memory_limit = 256M
max_execution_time = 60
